[package]
name = "nuclear-sim"
description = "Nuclear Game: a sandbox for nuclear physics with real nuclide data."
version = "0.1.2"
edition = "2024"

[dependencies]
sim-core = { git = "https://github.com/Plutonium239ohno/SimCore.git", branch = "main" }
macroquad = "0.4.16"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

# Keep debug builds usable: optimize dependencies, lightly optimize our code.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
